spring.application.name=employee-support-assistant
server.port=${SERVER_PORT:8089}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=20MB
server.error.include-message=never
python.service.base-url=${PYTHON_SERVICE_URL:http://localhost:8081}
python.service.connect-timeout=2s
python.service.read-timeout=8s
